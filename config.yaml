hotkey:
  modifier:
  - command
  - shift
  key: p
  enabled: true
ai:
  provider: rule
  openai_api_key: ''
  deepseek_api_key: ''
  model: gpt-4o-mini
  deepseek_model: deepseek-chat
  temperature: 0.2
  max_tokens: 500
ui:
  theme: dark
  width: 600
  height: 80
  position: center
  opacity: 0.95
  font_size: 16
system:
  default_browser: Safari
  terminal: Terminal
  file_manager: Finder
